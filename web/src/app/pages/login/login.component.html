<div class="min-h-screen bg-[#0A0A0A] flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold text-[#00FFD1] tracking-widest">PULSAR</h1>
      <p class="text-zinc-400 mt-2 text-sm">O radar do agora</p>
    </div>

    <!-- Card -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-xl">
      <h2 class="text-white text-xl font-semibold mb-6">
        {{ isRegister() ? 'Criar conta' : 'Entrar' }}
      </h2>

      <form (ngSubmit)="submit()" #f="ngForm" class="space-y-4">
        <div>
          <label class="block text-zinc-400 text-sm mb-1">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="seu@email.com"
            class="w-full bg-zinc-800 text-white border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-[#00FFD1] transition-colors"
          />
        </div>

        <div>
          <label class="block text-zinc-400 text-sm mb-1">Senha</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full bg-zinc-800 text-white border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-[#00FFD1] transition-colors"
          />
        </div>

        @if (error()) {
          <p class="text-red-400 text-sm bg-red-900/20 border border-red-800 rounded-lg px-3 py-2">
            {{ error() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-[#00FFD1] text-black font-bold py-3 rounded-lg hover:bg-[#00e6bb] transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ loading() ? 'Aguarde...' : (isRegister() ? 'Criar conta' : 'Entrar') }}
        </button>
      </form>

      <p class="text-center text-zinc-500 text-sm mt-6">
        {{ isRegister() ? 'Já tem conta?' : 'Não tem conta?' }}
        <button
          (click)="isRegister.set(!isRegister())"
          class="text-[#00FFD1] hover:underline ml-1"
        >
          {{ isRegister() ? 'Entrar' : 'Criar conta' }}
        </button>
      </p>
    </div>
  </div>
</div>
