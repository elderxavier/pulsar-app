<header class="site-header" [class.scrolled]="scrolled()">
  <div class="bar">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="logo">
        <span class="dot pulse-dot"></span>
      </span>
      <span class="wordmark">Pulsar</span>
    </a>

    <nav class="nav">
      @for (link of links; track link.anchor) {
        <a [href]="link.anchor" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <div class="cta">
      <a href="#download" class="btn btn-primary">Baixar</a>
    </div>

    <button class="burger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="mobile-nav">
      @for (link of links; track link.anchor) {
        <a [href]="link.anchor" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a href="#download" class="btn btn-primary mt-2" (click)="closeMenu()">Baixar para Android</a>
    </div>
  }
</header>
