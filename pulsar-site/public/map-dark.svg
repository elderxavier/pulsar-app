<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0c1322"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2942"/>
      <stop offset="100%" stop-color="#0a1d33"/>
    </linearGradient>
    <linearGradient id="park" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a23"/>
      <stop offset="100%" stop-color="#0c2520"/>
    </linearGradient>
    <pattern id="blocks" patternUnits="userSpaceOnUse" width="58" height="42">
      <rect x="2" y="2" width="22" height="16" rx="2" fill="#11192a"/>
      <rect x="30" y="2" width="26" height="16" rx="2" fill="#10182a"/>
      <rect x="2" y="24" width="30" height="14" rx="2" fill="#101828"/>
      <rect x="38" y="24" width="18" height="14" rx="2" fill="#11192a"/>
    </pattern>
  </defs>

  <!-- base + ruas implícitas via pattern -->
  <rect width="360" height="680" fill="url(#bg)"/>
  <rect width="360" height="680" fill="url(#blocks)" opacity="0.7"/>

  <!-- rio diagonal -->
  <path d="M -20,520 C 60,460 140,500 200,440 C 260,380 320,400 380,330 L 380,680 L -20,680 Z"
        fill="url(#water)" opacity="0.85"/>
  <path d="M -20,520 C 60,460 140,500 200,440 C 260,380 320,400 380,330"
        fill="none" stroke="#2dd4ff" stroke-width="0.6" opacity="0.25"/>

  <!-- parque -->
  <rect x="60" y="120" width="120" height="80" rx="10" fill="url(#park)"/>
  <text x="120" y="166" text-anchor="middle" fill="#3aa78c" opacity="0.55"
        font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">PARQUE</text>

  <!-- praça redonda -->
  <circle cx="240" cy="270" r="22" fill="url(#park)"/>
  <circle cx="240" cy="270" r="22" fill="none" stroke="#1c3a32" stroke-width="1"/>

  <!-- avenidas principais (linhas claras) -->
  <g stroke="#2a3550" stroke-linecap="round">
    <line x1="0"   y1="98"  x2="360" y2="98"  stroke-width="2.6" opacity="0.9"/>
    <line x1="0"   y1="240" x2="360" y2="240" stroke-width="2.6" opacity="0.9"/>
    <line x1="0"   y1="380" x2="360" y2="380" stroke-width="2.6" opacity="0.9"/>
    <line x1="120" y1="0"   x2="120" y2="680" stroke-width="2.6" opacity="0.9"/>
    <line x1="270" y1="0"   x2="270" y2="680" stroke-width="2.6" opacity="0.9"/>
  </g>

  <!-- diagonal/avenida -->
  <line x1="0" y1="20" x2="360" y2="340" stroke="#2a3550" stroke-width="2.2" opacity="0.7"/>

  <!-- ruas secundárias -->
  <g stroke="#1a2236" stroke-width="1">
    <line x1="0" y1="50"  x2="360" y2="50"/>
    <line x1="0" y1="160" x2="360" y2="160"/>
    <line x1="0" y1="200" x2="360" y2="200"/>
    <line x1="0" y1="300" x2="360" y2="300"/>
    <line x1="0" y1="340" x2="360" y2="340"/>
    <line x1="0" y1="420" x2="360" y2="420"/>
    <line x1="0" y1="460" x2="360" y2="460"/>
    <line x1="60"  y1="0" x2="60"  y2="680"/>
    <line x1="180" y1="0" x2="180" y2="680"/>
    <line x1="220" y1="0" x2="220" y2="680"/>
    <line x1="320" y1="0" x2="320" y2="680"/>
  </g>

  <!-- highlights de POIs -->
  <g fill="#1d2a3f">
    <rect x="190" y="106" width="60" height="22" rx="3"/>
    <rect x="284" y="248" width="60" height="22" rx="3"/>
    <rect x="20"  y="386" width="80" height="22" rx="3"/>
    <rect x="200" y="396" width="50" height="14" rx="3"/>
  </g>

  <!-- linha de transporte (metrô) -->
  <line x1="20" y1="240" x2="340" y2="240" stroke="#ff7ab5" stroke-width="1.4" opacity="0.55" stroke-dasharray="6 6"/>
  <circle cx="120" cy="240" r="3" fill="#ff7ab5" opacity="0.85"/>
  <circle cx="270" cy="240" r="3" fill="#ff7ab5" opacity="0.85"/>

  <!-- legenda discreta -->
  <g font-family="Inter, system-ui, sans-serif" fill="#3a4b6a" font-size="8" letter-spacing="0.1em" font-weight="600">
    <text x="14" y="92"  opacity="0.75">AV. CENTRAL</text>
    <text x="14" y="234" opacity="0.75">RUA DA PRAÇA</text>
    <text x="14" y="374" opacity="0.65">CORREDOR SUL</text>
    <text x="270" y="660" opacity="0.45" text-anchor="end">PULSAR · MAPA DE EXEMPLO</text>
  </g>
</svg>
