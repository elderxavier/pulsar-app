<div class="min-h-screen bg-[#0A0A0A] text-white flex flex-col">

  <!-- Top bar -->
  <header class="flex items-center gap-3 px-4 py-3 border-b border-white/[0.06] bg-[#0A0A0A] sticky top-0 z-10">
    <button (click)="router.navigate(['/map'])" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-white/[0.04] transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
    </button>
    <h1 class="text-base font-semibold">Novo pulso</h1>
  </header>

  <!-- Form -->
  <form (ngSubmit)="submit()" class="flex-1 px-4 py-4 space-y-4 max-w-xl w-full mx-auto">

    <!-- Title -->
    <div>
      <label class="block text-zinc-400 text-xs mb-1.5">Título <span class="text-zinc-700">(opcional)</span></label>
      <input [(ngModel)]="title" name="title" maxlength="100" placeholder="Resumo curto..."
        class="w-full bg-[#1A1A1A] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-700 focus:outline-none focus:border-[#00FFD1] transition-colors" />
      <div class="text-right text-zinc-700 text-[10px] mt-1">{{ title.length }}/100</div>
    </div>

    <!-- Content -->
    <div>
      <label class="block text-zinc-400 text-xs mb-1.5">Descrição</label>
      <textarea [(ngModel)]="content" name="content" maxlength="280" rows="4" required placeholder="O que está acontecendo agora?"
        class="w-full bg-[#1A1A1A] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-700 focus:outline-none focus:border-[#00FFD1] resize-none transition-colors"></textarea>
      <div class="text-right text-zinc-700 text-[10px] mt-1">{{ content.length }}/280</div>
    </div>

    <!-- Date range -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-zinc-400 text-xs mb-1.5">Início</label>
        <input type="datetime-local" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)" name="start"
          class="w-full bg-[#1A1A1A] border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#00FFD1] transition-colors [color-scheme:dark]" />
      </div>
      <div>
        <label class="block text-zinc-400 text-xs mb-1.5">Fim</label>
        <input type="datetime-local" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)" name="end"
          class="w-full bg-[#1A1A1A] border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#00FFD1] transition-colors [color-scheme:dark]" />
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="bg-[#00FFD1]/10 text-[#00FFD1] text-xs font-medium px-3 py-1 rounded-full">Duração: {{ durationLabel() }}</span>
    </div>

    <!-- Image URL -->
    <div>
      <label class="block text-zinc-400 text-xs mb-1.5">Imagem <span class="text-zinc-700">(URL pública)</span></label>
      <input [(ngModel)]="imageUrl" name="image" placeholder="https://..."
        class="w-full bg-[#1A1A1A] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-700 focus:outline-none focus:border-[#00FFD1] transition-colors" />
      @if (imageUrl) {
        <img [src]="imageUrl" class="mt-2 w-full h-40 object-cover rounded-xl border border-zinc-800" (error)="$any($event.target).style.display='none'" />
      }
    </div>

    <!-- Location status -->
    <div class="bg-[#1A1A1A] border border-zinc-800 rounded-xl px-4 py-3 flex items-center gap-3">
      <div class="w-2 h-2 rounded-full" [class]="loc() ? 'bg-[#00FFD1] animate-pulse' : 'bg-zinc-600'"></div>
      <div class="flex-1 text-xs">
        @if (loc()) {
          <span class="text-zinc-300">Localização: {{ loc()!.lat.toFixed(4) }}, {{ loc()!.lng.toFixed(4) }}</span>
        } @else {
          <span class="text-zinc-500">Aguardando localização GPS…</span>
        }
      </div>
    </div>

    @if (error()) {
      <p class="text-red-400 text-sm">{{ error() }}</p>
    }

    <!-- Submit -->
    <button type="submit" [disabled]="saving() || !loc() || !content.trim()"
      class="w-full bg-[#00FFD1] text-[#0A0A0A] font-bold py-3.5 rounded-xl text-sm hover:bg-[#00e6bb] active:scale-[0.98] transition-all disabled:opacity-40 disabled:cursor-not-allowed">
      @if (saving()) {
        <div class="w-4 h-4 mx-auto border-2 border-[#0A0A0A]/30 border-t-[#0A0A0A] rounded-full animate-spin"></div>
      } @else { <span>Publicar pulso</span> }
    </button>
  </form>
</div>
