<div class="min-h-screen bg-[#0A0A0A] flex items-center justify-center p-6">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-12">
      <div class="inline-flex items-center gap-2.5 mb-2">
        <div class="w-2 h-2 rounded-full bg-[#00FFD1]"></div>
        <h1 class="text-[#00FFD1] text-3xl font-bold tracking-[0.4em]">PULSAR</h1>
      </div>
      <p class="text-zinc-500 text-sm">O radar do agora</p>
    </div>

    <!-- Card -->
    <div class="bg-[#1A1A1A] rounded-2xl p-6 shadow-xl">
      <h2 class="text-white text-lg font-semibold mb-6">{{ isRegister() ? 'Criar conta' : 'Entrar' }}</h2>

      <form (ngSubmit)="submit()" class="space-y-3">
        <div>
          <label class="block text-zinc-400 text-xs mb-1.5">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="seu@email.com"
            class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-700 focus:outline-none focus:border-[#00FFD1] transition-colors" />
        </div>
        <div>
          <label class="block text-zinc-400 text-xs mb-1.5">Senha</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="Mínimo 6 caracteres"
            class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-700 focus:outline-none focus:border-[#00FFD1] transition-colors" />
        </div>

        @if (error()) {
          <p class="text-red-400 text-xs pt-1">{{ error() }}</p>
        }

        <button type="submit" [disabled]="loading()"
          class="w-full bg-[#00FFD1] text-[#0A0A0A] font-bold py-3 rounded-xl text-sm hover:bg-[#00e6bb] active:scale-[0.98] transition-all disabled:opacity-40 disabled:cursor-not-allowed mt-4">
          @if (loading()) {
            <div class="w-4 h-4 mx-auto border-2 border-[#0A0A0A]/30 border-t-[#0A0A0A] rounded-full animate-spin"></div>
          } @else {
            <span>{{ isRegister() ? 'Criar conta' : 'Entrar' }}</span>
          }
        </button>

        <button type="button" (click)="isRegister.set(!isRegister()); error.set(null)"
          class="w-full text-[#00FFD1] text-sm py-2 hover:text-[#33ffdb] transition-colors">
          {{ isRegister() ? 'Já tem conta? Entrar' : 'Não tem conta? Criar conta' }}
        </button>
      </form>

      <!-- Divisor -->
      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-zinc-800"></div>
        <span class="text-zinc-600 text-xs">ou</span>
        <div class="flex-1 h-px bg-zinc-800"></div>
      </div>

      <!-- Botão Google -->
      <button (click)="loginGoogle()" [disabled]="loading()"
        class="w-full flex items-center justify-center gap-3 bg-[#1A1A1A] border border-zinc-700 rounded-xl py-3 text-sm text-white hover:border-zinc-500 active:scale-[0.98] transition-all disabled:opacity-40">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continuar com Google</span>
      </button>
    </div>
  </div>
</div>
